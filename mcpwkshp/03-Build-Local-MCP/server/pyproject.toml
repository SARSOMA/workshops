[project]
name = "repo-doctor"
version = "0.1.0"
description = "An MCP server that diagnoses the health of a local repo."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
]

# This project is a single-file script (server.py), not an installable package,
# so tell uv not to try to build/install it as a wheel.
[tool.uv]
package = false
